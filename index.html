<html>
<head>
    <title>My Personal Website</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }
        .card {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px black;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #764ba2;
        }
        h1 {
            color: #333;
        }
        p {
            color: gray;
        }
        .btn {
            display: inline-block;
            background: #764ba2;
            color: white;
            padding: 10px 20px;
            margin: 10px;
            text-decoration: none;
            border-radius: 30px;
        }
        .btn:hover {
            background: #667eea;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Profile Photo">
    <h1>Mera Naam</h1>
    <p>Main website banana seekh raha/rahi hoon 😊</p>
    <p>HTML, CSS, aur aage JavaScript bhi seekhunga</p>
    
    <a href="#" class="btn">Instagram</a>
    <a href="#" class="btn">YouTube</a>
    <a href="#" class="btn">GitHub</a>
</div>

</body>
</html>
